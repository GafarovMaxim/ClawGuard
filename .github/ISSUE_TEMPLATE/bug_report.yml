name: Bug Report
description: Report a bug or unexpected behavior in ClawGuard
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ClawGuard! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open ClawGuard
        2. Pin IP ...
        3. Drop VPN
        4. See error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, VPN client used, and network adapter type.
      placeholder: Windows 11 23H2, WireGuard, Ethernet
    validations:
      required: true

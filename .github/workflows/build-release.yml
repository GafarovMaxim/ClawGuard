name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executables
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build ClawGuard Binaries & Packages
        shell: cmd
        run: |
          build.bat pack

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClawGuard.exe
            dist/ClawGuardPortable.exe
            dist/ClawGuard-*.zip
            dist/ClawGuardPortable-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
